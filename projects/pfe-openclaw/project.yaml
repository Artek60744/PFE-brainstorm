# Configuration du projet de brainstorming
# PFE : Agent IA RPAE pour réduction MTTR

project:
  id: "pfe-openclaw"
  name: "Agent IA RPAE pour réduction MTTR"
  version: "1.0"
  created: "2024-01-01"
  status: "active"
  
# Métadonnées
metadata:
  type: "pfe"  # Projet de Fin d'Études
  organization: "Isagri"
  institution: "UniLaSalle (RIOC)"
  author: "Étudiant PFE"
  
# Objectifs et métriques
goals:
  primary: "Réduire le MTTR des incidents DevOps de 50%"
  secondary:
    - "Implémenter le pattern RPAE (Read-Plan-Approve-Execute)"
    - "Intégrer avec Azure DevOps via MCP"
    - "Créer un dashboard de suivi des pipelines"
  kpis:
    - name: "Réduction MTTR"
      target: "50%"
      measurement: "Chronomètre manuel + Work Items ADO"
    - name: "Précision diagnostic"
      target: "80%"
      measurement: "Validation humaine"
    - name: "Confiance équipe"
      target: ">3/5"
      measurement: "Survey qualitative"

# Contraintes du projet
constraints:
  timeline:
    total: "26 semaines"
    mvp: "Semaine 15"
    v1: "Semaine 20"
  environment:
    type: "Production uniquement"
    sandbox: false
    dry_run_required: true
    test_prefix: "[OPENCLAW-TEST]"
  approval:
    channel: "Teams (canal dédié équipe DevOps)"
    levels: 3
    timeout: "30 minutes"

# Stack technique
stack:
  agent:
    framework: "OpenClaw"
    reason: "Open-source, mémoire persistante, Heartbeat natif"
  integration:
    protocol: "MCP (Model Context Protocol)"
    servers:
      - "MCP Microsoft (Azure DevOps)"
      - "MCP Digital.ai Release"
  database:
    poc: "SQLite"
    production: "PostgreSQL"
    strategy: "Mémoire par pipeline"
  dashboard:
    options:
      - "Streamlit"
      - "FastAPI + HTMX"
    required: true  # MVP obligatoire
  communication:
    primary: "Teams"
    features:
      - "Boutons interactifs"
      - "Canal dédié équipe DevOps"

# Agents actifs pour ce projet
agents:
  active:
    - id: "AGENT-ARCHITECTE"
      template: "TPL-ARCHITECTE"
      customized: true
    - id: "AGENT-DEVOPS"
      template: "TPL-DEVOPS"
      customized: true
    - id: "AGENT-SECURITE"
      template: "TPL-SECOPS"
      customized: true
    - id: "AGENT-PRODUIT"
      template: "TPL-PRODUCT-OWNER"
      customized: true
    - id: "AGENT-RECHERCHE"
      template: "TPL-CHERCHEUR"
      customized: true
    - id: "AGENT-CRITIQUE"
      template: "TPL-CRITIQUE"
      customized: true

# Workflows utilisés
workflows:
  enabled:
    - "WF-BRAINSTORM-IDEES"
    - "WF-DESIGN-ARCHI"
    - "WF-PLANIFICATION"
    - "WF-REVUE-SECURITE"
    - "WF-RETROSPECTIVE"
    - "WF-VALIDATION-LIVRABLE"

# Phases du projet
phases:
  - id: "phase-0"
    name: "Setup & Découverte"
    weeks: "1-3"
    status: "planned"
  - id: "phase-1"
    name: "Read"
    weeks: "4-6"
    status: "planned"
  - id: "phase-2"
    name: "Plan"
    weeks: "7-9"
    status: "planned"
  - id: "phase-3"
    name: "Approve"
    weeks: "10-12"
    status: "planned"
  - id: "phase-4"
    name: "Execute"
    weeks: "13-15"
    status: "planned"
  - id: "phase-5"
    name: "Industrialisation & Mesure"
    weeks: "16-20"
    status: "planned"
  - id: "phase-6"
    name: "Rédaction & Soutenance"
    weeks: "21-26"
    status: "planned"
